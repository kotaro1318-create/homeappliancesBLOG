name: Daily Instagram Post

on:
  schedule:
    - cron: "0 3 * * *" # 12:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると実際には投稿せずログのみ出力"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Post next article to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_BRANCH: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/post-to-instagram.mjs
